{% extends 'base.html' %}

{% block content %}

<body class="bg-light">


<!-- ==========================================
                    LAYOUT
========================================== -->

<div class="container-fluid">

<div class="row">


<!--    ============== EXTEND SIDEBAR =======================-->
<!--    =====================================================-->
{% include 'dashboards/sidebar.html' %}

    <!-- ==================================
                MAIN CONTENT
    =================================== -->

    <main class="col-md-10 p-4">


        <!-- Page Heading -->

        <div class="d-flex
                    justify-content-between
                    align-items-center
                    mb-4">

            <div>

                <h2 class="fw-bold mb-1">
                    Dashboard
                </h2>

                <p class="text-muted mb-0">
                    Manage your blog content.
                </p>

            </div>

            <a href="{% url 'add_new_post' %}"
               class="btn btn-primary">

                <i class="bi bi-plus-lg me-1"></i>

                New Post

            </a>

        </div>


        <!-- ==================================
                STATISTICS
        =================================== -->

        <div class="row g-4 mb-4">

            <div class="col-lg">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between">

                            <div>

                                <p class="text-muted mb-1">
                                    Total Blogs
                                </p>

                                <h3 class="fw-bold">
                                    {{blog_count}}
                                </h3>

                            </div>

                            <i class="bi bi-file-text
                                      fs-1 text-primary"></i>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-lg">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between">

                            <div>
                                <a href="{% url 'category_dashboard' %}">
                                    <p class="text-muted mb-1">
                                    Category
                                </p>
                                </a>

                                <h3 class="fw-bold">
                                    {{category_count}}
                                </h3>

                            </div>

                            <i class="bi bi-tags
                                      fs-1 text"></i>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-lg">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between">

                            <div>

                                <p class="text-muted mb-1">
                                    Published
                                </p>

                                <h3 class="fw-bold">
                                    {{published_count}}
                                </h3>

                            </div>

                            <i class="bi bi-check-circle
                                      fs-1 text-success"></i>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-lg">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between">

                            <div>

                                <p class="text-muted mb-1">
                                    Drafts
                                </p>

                                <h3 class="fw-bold">
                                    {{drafted_count}}
                                </h3>

                            </div>

                            <i class="bi bi-pencil-square
                                      fs-1 text-warning"></i>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-lg">

                <div class="card border-0 shadow-sm">

                    <div class="card-body">

                        <div class="d-flex
                                    justify-content-between">

                            <div>

                                <p class="text-muted mb-1">
                                    Featured
                                </p>

                                <h3 class="fw-bold">
                                    {{featured_count}}
                                </h3>

                            </div>

                            <i class="bi bi-book
                                      fs-1 text-end"></i>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

</div>

{% endblock %}
