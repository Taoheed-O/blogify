{% extends 'base.html' %}

{% block content %}

<body class="bg-light">


<!-- ==========================================
                    LAYOUT
========================================== -->

<div class="container-fluid">

<div class="row">


<!--    ============== EXTEND SIDEBAR =======================-->
<!--    =====================================================-->
{% include 'dashboards/sidebar.html' %}

    <!-- ==================================
                MAIN CONTENT
    =================================== -->
{% load crispy_forms_tags %}

    <main class="col-md-10 p-4" >
         <h2><b> Posts </b></h2>
                <div class="register-card align-content-md-center">
                    <form action="{% url 'add_new_post' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{form | crispy}}
                        <button type="submit" class="btn btn-primary float-lg-start">
                            submit
                        </button>
                    </form>
                </div>

    </main>

</div>

</div>

{% endblock %}
