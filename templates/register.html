{% extends 'base.html '%}

{% block content %}

{% load crispy_forms_tags %}
<main class="register-page">

    <div class="register-card">

        <h1>Create Account</h1>

        <p>
            Join Blogify and start sharing your ideas.
        </p>
        <form method="POST">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit">
                Register
            </button>

        </form>

        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>

{% endblock %}
