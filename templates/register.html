<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Create Account | Blogify</title>

<link rel="stylesheet"
      href="{% static 'css/home.css' %}">


</head>

<body>

<main class="register-page">

    <div class="register-card">

        <h1>Create Account</h1>

        <p>
            Join Blogify and start sharing your ideas.
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>

            <button type="submit">
                Register
            </button>

        </form>

        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

</main>

</body>

</html>
